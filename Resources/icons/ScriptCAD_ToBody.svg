<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ac0cd"/>
      <stop offset="100%" stop-color="#729fcf"/>
    </linearGradient>
    <linearGradient id="bodyLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3465a4"/>
      <stop offset="100%" stop-color="#204a87"/>
    </linearGradient>
    <linearGradient id="bodyRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f7fb8"/>
      <stop offset="100%" stop-color="#2c5380"/>
