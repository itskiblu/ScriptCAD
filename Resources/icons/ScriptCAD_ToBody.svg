  </defs>

  <!-- PartDesign Local Coordinate System Origin (Yellow Axes) -->
  <line x1="16" y1="46" x2="16" y2="16" stroke="#edd400" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="46" x2="48" y2="46" stroke="#edd400" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="46" x2="6" y2="56" stroke="#edd400" stroke-width="3" stroke-linecap="round"/>

  <!-- Solid Feature Box inside Body -->
  <polygon points="36,16 54,26 36,36 18,26" fill="url(#bodyTop)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="18,26 36,36 36,52 18,42" fill="url(#bodyLeft)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="36,36 54,26 54,42 36,52" fill="url(#bodyRight)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>

  <!-- Active Indicator: Small green check/tip at corner -->
