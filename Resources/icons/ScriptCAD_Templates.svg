<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tmplGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7fb8"/>
      <stop offset="100%" stop-color="#3465a4"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eeeeec"/>
    </linearGradient>
  </defs>
  <!-- Book / Template binder back -->
  <rect x="10" y="10" width="44" height="46" rx="4" fill="url(#tmplGrad)" stroke="#204a87" stroke-width="2.5"/>
  <!-- Binder spine accent -->
  <line x1="18" y1="10" x2="18" y2="56" stroke="#204a87" stroke-width="2.5"/>
  <!-- Inner code sheet -->
  <rect x="22" y="16" width="26" height="34" rx="2" fill="url(#pageGrad)" stroke="#babdb6" stroke-width="1.5"/>
  <!-- Code lines -->
  <line x1="26" y1="23" x2="42" y2="23" stroke="#f57900" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="38" y2="30" stroke="#729fcf" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="37" x2="44" y2="37" stroke="#73d216" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="44" x2="34" y2="44" stroke="#888a85" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Star / Recipe badge -->
  <circle cx="48" cy="16" r="9" fill="#fce94f" stroke="#c4a000" stroke-width="2"/>
  <polygon points="48,10 50,14 55,14 51,17 53,21 48,18 43,21 45,17 41,14 46,14" fill="#f57900"/>
</svg>
