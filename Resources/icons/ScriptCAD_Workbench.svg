<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ac0cd"/>
      <stop offset="100%" stop-color="#729fcf"/>
    </linearGradient>
    <linearGradient id="wbLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3465a4"/>
      <stop offset="100%" stop-color="#204a87"/>
    </linearGradient>
    <linearGradient id="wbRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f7fb8"/>
      <stop offset="100%" stop-color="#2c5380"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcaf3e"/>
      <stop offset="100%" stop-color="#f57900"/>
    </linearGradient>
  </defs>

  <!-- 3D Isometric CAD Cube -->
  <!-- Top Face -->
  <polygon points="32,7 54,20 32,33 10,20" fill="url(#wbTop)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="10,20 32,33 32,56 10,43" fill="url(#wbLeft)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="32,33 54,20 54,43 32,56" fill="url(#wbRight)" stroke="#204a87" stroke-width="2" stroke-linejoin="round"/>

  <!-- Procedural Script Badge: Orange circular badge with Python script glyphs -->
  <circle cx="45" cy="45" r="14" fill="url(#badgeGrad)" stroke="#ce5c00" stroke-width="2.2"/>
  <!-- Terminal Prompt / Brackets: </ > inside badge -->
  <path d="M 39 40 L 35 45 L 39 50" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 51 40 L 55 45 L 51 50" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="47" y1="39" x2="43" y2="51" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
