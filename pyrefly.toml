# Pyrefly configuration for FreeCAD ScriptCAD workbench
# FreeCAD C++ and Qt modules are provided dynamically at runtime by FreeCAD.
python-interpreter-path = "C:/Program Files/FreeCAD 1.1/bin/python.exe"
ignore-missing-imports = [
    "FreeCAD",
    "FreeCAD.*",
    "FreeCADGui",
    "FreeCADGui.*",
    "Part",
    "Part.*",
    "PartDesignGui",
    "PartDesignGui.*",
    "Draft",
    "Draft.*",
    "Sketcher",
    "Sketcher.*",
    "PySide6",
    "PySide6.*",
    "PySide2",
    "PySide2.*",
]

search-path = [
    ".",
    "scriptcad",
    "blendcad",
    "gui",
    "C:/Program Files/FreeCAD 1.1/bin",
    "C:/Program Files/FreeCAD 1.1/lib",
    "C:/Program Files/FreeCAD 1.1/Mod",
    "C:/Program Files/FreeCAD 1.1/bin/Lib/site-packages",
]
